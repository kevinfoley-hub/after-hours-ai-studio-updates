name: Build and Release Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "v17_auto_release.py"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 17.0.0"
        required: true
        default: "17.0.0"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}"
          } else {
            $v = "17.0.0"
          }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Build Windows EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "After_Hours_AI_Mega_Studio_V17" v17_auto_release.py

      - name: Calculate SHA-256
        id: hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\After_Hours_AI_Mega_Studio_V17.exe" -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Create or replace GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release delete "v$env:VERSION" --yes --cleanup-tag 2>$null
          gh release create "v$env:VERSION" "dist\After_Hours_AI_Mega_Studio_V17.exe" `
            --target "${{ github.sha }}" `
            --title "After Hours AI Mega Studio V$env:VERSION" `
            --notes "Automated Windows release for After Hours AI Mega Studio V$env:VERSION."

      - name: Update manifest
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/download/v$env:VERSION/After_Hours_AI_Mega_Studio_V17.exe"
          $manifest = @{
            version = $env:VERSION
            url = $url
            sha256 = $env:SHA256
            notes = "After Hours AI Mega Studio V$env:VERSION is available."
          } | ConvertTo-Json
          Set-Content -Path "update_manifest.json" -Value $manifest -Encoding UTF8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update_manifest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update manifest for V$env:VERSION"
            git push
          }
